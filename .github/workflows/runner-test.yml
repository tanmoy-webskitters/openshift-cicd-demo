name: Build and Push Application

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: self-hosted

    env:
      REGISTRY: ${{ secrets.OPENSHIFT_REGISTRY }}
      IMAGE_NAME: cicd-demo/myapp

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Show runner information
        run: |
          echo "Runner hostname:"
          hostname
          echo "User:"
          whoami
          echo "Working directory:"
          pwd

      - name: Test application
        run: |
          python3 --version
          python3 -m py_compile app.py

      - name: Build container image
        run: |
          podman build -t $REGISTRY/$IMAGE_NAME:${{ github.sha }} .

      - name: Login to OpenShift registry
        run: |
          podman login \
            --tls-verify=false \
            -u github-actions \
            -p "${{ secrets.OPENSHIFT_TOKEN }}" \
            "$REGISTRY"

      - name: Push container image
        run: |
          podman push \
            --tls-verify=false \
            "$REGISTRY/$IMAGE_NAME:${{ github.sha }}"

      - name: Show image
        run: |
          podman images
